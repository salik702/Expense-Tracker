{% extends "base.html" %}

{% block title %}Add expense — Spendly{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/add_expense.css') }}">
{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="auth-container">

        <div class="auth-header">
            <h1 class="auth-title">Add expense</h1>
            <p class="auth-subtitle">Record a new expense</p>
        </div>

        <div class="auth-card">
            {% if error %}
            <div class="auth-error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('add_expense') }}">
                <input type="hidden" name="csrf_token" value="{{ session['csrf_token'] }}">
                <div class="form-group">
                    <label for="amount">Amount</label>
                    <div class="amount-input-group">
                        <span class="currency-prefix" aria-hidden="true">₨</span>
                        <input type="number" id="amount" name="amount"
                               class="form-input" placeholder="0.00"
                               min="0.01" step="0.01"
                               value="{{ amount|default('') }}"
                               required autofocus>
                    </div>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" class="form-select" required>
                        {% for cat in categories %}
                        <option value="{{ cat }}"{% if category == cat %} selected{% endif %}>{{ cat }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date"
                           class="form-input"
                           value="{{ date|default('') }}"
                           required>
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <input type="text" id="description" name="description"
                           class="form-input" placeholder="e.g. Groceries for the week"
                           maxlength="200"
                           value="{{ description|default('') }}">
                    <p class="form-hint">Optional</p>
                </div>
                <button type="submit" class="btn-submit">Add expense</button>
            </form>
        </div>

    </div>
</section>

{% endblock %}
